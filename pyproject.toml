[project]
name = "ho"
version = "0.1.0"
description = "Interactive Japanese textbook following Minna no Nihongo"
requires-python = ">=3.12"
dependencies = [
    "fugashi>=1.5.2",
    "jinja2>=3.1",
    "unidic-lite>=1.0.8",
]

[project.scripts]
build = "ho.build:main"
refdata = "ho.refdata:main"
illustrate = "ho.illustrate:main"

[dependency-groups]
dev = ["pytest>=8"]
tools = ["pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ho"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
