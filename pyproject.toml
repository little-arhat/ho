[project]
name = "ho"
version = "0.1.0"
description = "Interactive Japanese textbook following Minna no Nihongo"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1"]

[project.scripts]
build = "ho.build:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ho"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
