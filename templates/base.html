<!doctype html>
<html lang="en" data-langs="en ru uk" data-furigana="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} · ho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="icon" href="{{ root }}static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}static/css/site.css">
<script type="module" src="{{ root }}static/js/prefs.js"></script>
<script type="module" src="{{ root }}static/js/speech.js"></script>
</head>
<body class="page-{{ page }}">
<header class="site">
  <a class="brand" href="{{ root or "./" }}"><span lang="ja">本</span> ho</a>
  <nav>
    {% for s in sections %}<a href="{{ root }}{{ s.href }}"{% if s.page == page %} aria-current="page"{% endif %}>{{ s.label }}</a>{% endfor %}
  </nav>
  <div class="prefs" id="prefs" aria-label="Display preferences"></div>
</header>
<main class="wrap">
{% block main %}{% endblock %}
</main>
<footer class="site wrap">Sister project: <a href="https://github.com/little-arhat/perapera" rel="noopener">perapera</a>.</footer>
{% block scripts %}{% endblock %}
</body>
</html>
