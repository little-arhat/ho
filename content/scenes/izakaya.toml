en = "I'm going to the art museum with a friend. And you, Wang?"
ru = "Пойду с подругой в музей. А ты, Ван?"
uk = "Піду з подругою до музею. А ти, Ване?"
es = "Voy al museo con una amiga. ¿Y tú, Wang?"

[[dialog]]
speaker = "ワン"
ja = "家[うち]|で|寝[ね]ます|。|今[こん]週[しゅう]|は|忙[いそが]しかったです=忙[いそが]しい|から|。"
en = "I'm going to sleep at home. This week was busy."
ru = "Буду спать дома. Эта неделя была тяжёлой."
uk = "Спатиму вдома. Цей тиждень був важкий."
es = "Me quedo en casa durmiendo. Esta semana ha sido muy ajetreada."

[[dialog]]
speaker = "田[た]中[なか]"
