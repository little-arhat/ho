en = "Certainly. … It's nearly last-order time."
ru = "Конечно. …Скоро последний заказ."
uk = "Звісно. …Скоро останнє замовлення."
es = "Enseguida. … Es casi la hora de la última comanda."
uses = ["ラストオーダーになりますが"]

[[dialog]]
speaker = "マリア"
