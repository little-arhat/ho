en = "Cheers! … Oh, this fried chicken is good."
ru = "За нас! …О, какая вкусная курица."
uk = "Будьмо! …О, яка смачна курка."
es = "¡Salud! … Ah, qué rico este pollo frito."
uses = ["乾杯[かんぱい]！"]

[[dialog]]
speaker = "ワン"
