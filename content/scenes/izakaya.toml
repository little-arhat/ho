title = { en = "Friday at the izakaya", ru = "Пятница в идзакае", uk = "П'ятниця в ідзакаї", es = "Viernes en la izakaya" }
scene = "A lively Japanese izakaya in the evening: four young colleagues sit at a wooden counter with beer mugs, a glass of oolong tea, small plates of edamame, yakitori skewers and fried chicken; a smiling staff member in a headband takes an order; paper lanterns and handwritten menu boards on the wall."

[[prose]]
ja = "金[きん]曜[よう]日[び]|の|晩[ばん]|、|マリア|さん|と|田[た]中[なか]|さん|と|ワン|さん|と|カリナ|さん|は|駅[えき]|の|近[ちか]く|の|居[い]酒[ざか]屋[や]|へ|行[い]きました=行[い]きます|。|予[よ]約[やく]|は|していませんでした|。|でも|、|カウンター|の|席[せき]|に|座[すわ]りました=座[すわ]ります|。"
en = "On Friday evening Maria, Mr. Tanaka, Wang and Karina went to an izakaya near the station. They had no reservation, but they got seats at the counter."
ru = "В пятницу вечером Мария, Танака-сан, Ван и Карина пошли в идзакаю у станции. Столик они не бронировали, но сели за стойку."
uk = "У п'ятницю ввечері Марія, Танака-сан, Ван і Карина пішли до ідзакаї біля станції. Столика вони не бронювали, але сіли за стійку."
es = "El viernes por la noche Maria, el señor Tanaka, Wang y Karina fueron a una izakaya cerca de la estación. No tenían reserva, pero se sentaron en la barra."

[[prose]]
ja = "田[た]中[なか]|さん|は|「|とりあえず|生[なま]|で|」|と|言[い]いました=言[い]います|。|マリア|さん|と|ワン|さん|も|ビール|を|飲[の]みました=飲[の]みます|。|カリナ|さん|は|お酒[さけ]=酒[さけ]|を|飲[の]みません=飲[の]みます|。|ウーロン茶[ちゃ]|を|頼[たの]みました=頼[たの]みます|。"
en = "Mr. Tanaka said, \"A draught beer to start.\" Maria and Wang had beer too. Karina doesn't drink, so she ordered oolong tea."
ru = "Танака-сан сказал: «Для начала разливное». Мария и Ван тоже пили пиво. Карина не пьёт алкоголь и заказала улун."
uk = "Танака-сан сказав: «Для початку розливне». Марія і Ван теж пили пиво. Карина не п'є алкоголю і замовила улун."
es = "El señor Tanaka dijo: «Para empezar, una caña». Maria y Wang también tomaron cerveza. Karina no bebe alcohol y pidió té oolong."
uses = ["とりあえず生[なま]で"]

[[prose]]
ja = "最[さい]初[しょ]|に|、|小[ちい]さい|料[りょう]理[り]|が|来[き]ました=来[き]ます|。|お通[とお]し|です|。|それから|、|枝[えだ]豆[まめ]|と|唐[から]揚[あ]げ|と|焼[や]き鳥[とり]|を|注[ちゅう]文[もん]|しました=します|。|焼[や]き鳥[とり]|は|塩[しお]|と|タレ|、|両[りょう]方[ほう]|です|。"
en = "First a small dish came: the table appetizer. Then they ordered edamame, fried chicken and yakitori, the yakitori both with salt and with sauce."
ru = "Сначала принесли маленькую закуску — это «отоси». Потом они заказали эдамамэ, курицу во фритюре и якитори — и с солью, и с соусом."
uk = "Спочатку принесли маленьку закуску — це «отосі». Потім вони замовили едамаме, курку у фритюрі та якіторі — і з сіллю, і з соусом."
es = "Primero llegó un platito: el aperitivo de la casa. Luego pidieron edamame, pollo frito y yakitori, con sal y con salsa."

[[prose]]
ja = "四[よ]人[にん]|は|仕[し]事[ごと]|の|話[はなし]|と|週[しゅう]末[まつ]|の|話[はなし]|を|しました=します|。|とても|楽[たの]しかったです=楽[たの]しい|。|十[じゅう]時[じ]|に|お会[かい]計[けい]|を|しました=します|。|お会[かい]計[けい]|は|別[べつ]々[べつ]|でした|。"
en = "The four of them talked about work and about the weekend. It was great fun. At ten they paid; they paid separately."
ru = "Вчетвером они говорили о работе и о выходных. Было очень весело. В десять расплатились — каждый за себя."
uk = "Учотирьох вони говорили про роботу та про вихідні. Було дуже весело. О десятій розрахувалися — кожен за себе."
es = "Los cuatro hablaron del trabajo y del fin de semana. Se lo pasaron muy bien. A las diez pagaron, cada uno lo suyo."

[[dialog]]
speaker = "店[てん]員[いん]"
ja = "いらっしゃいませ|！|何[なん]名[めい]様[さま]|です|か|。"
en = "Welcome! How many people?"
ru = "Добро пожаловать! Сколько вас?"
uk = "Ласкаво просимо! Скільки вас?"
es = "¡Bienvenidos! ¿Cuántas personas son?"
uses = ["いらっしゃいませ", "何名様[なんめいさま]ですか"]

[[dialog]]
speaker = "田[た]中[なか]"
ja = "四[よ]人[にん]|です|。|予[よ]約[やく]|していないんですが|、|入[はい]れますか=入[はい]れます|。"
en = "Four. We don't have a reservation. Can we get in?"
ru = "Четверо. Мы без брони. Можно войти?"
uk = "Четверо. Ми без бронювання. Можна зайти?"
es = "Cuatro. No tenemos reserva. ¿Podemos entrar?"
uses = ["予約[よやく]していないんですが、入[はい]れますか"]

[[dialog]]
speaker = "店[てん]員[いん]"
ja = "カウンター|席[せき]|でも|よろしいですか|。"
en = "Is the counter all right?"
ru = "За стойкой вас устроит?"
uk = "За стійкою вам підійде?"
es = "¿Les va bien la barra?"
uses = ["カウンター席[せき]でもよろしいですか"]

[[dialog]]
speaker = "田[た]中[なか]"
ja = "はい|、|大[だい]丈[じょう]夫[ぶ]|です|。"
en = "Yes, that's fine."
ru = "Да, конечно."
uk = "Так, звісно."
es = "Sí, perfecto."
uses = ["大丈夫[だいじょうぶ]です"]

[[dialog]]
speaker = "店[てん]員[いん]"
ja = "こちら|の|お席[せき]=席[せき]|へ|どうぞ|。|お飲[の]み物[もの]=飲[の]み物[もの]|は|いかがなさいますか|。"
en = "This way to your seats, please. What would you like to drink?"
ru = "Проходите сюда, пожалуйста. Что будете пить?"
uk = "Проходьте сюди, будь ласка. Що питимете?"
es = "Por aquí, por favor. ¿Qué van a tomar?"
uses = ["こちらのお席[せき]へどうぞ", "お飲[の]み物[もの]はいかがなさいますか"]

[[dialog]]
speaker = "田[た]中[なか]"
ja = "とりあえず|生[なま]|で|。|三[みっ]つ|お願[ねが]いします|。"
en = "Three draught beers to start, please."
ru = "Для начала три разливных, пожалуйста."
uk = "Для початку три розливних, будь ласка."
es = "Para empezar, tres cañas, por favor."
uses = ["とりあえず生[なま]で"]

[[dialog]]
speaker = "カリナ"
ja = "私[わたし]|は|お酒[さけ]=酒[さけ]|は|ちょっと…|。|ノンアルコール|の|飲[の]み物[もの]|は|ありますか|。"
en = "Alcohol's not really for me… Do you have non-alcoholic drinks?"
ru = "А я алкоголь не очень… У вас есть безалкогольные напитки?"
uk = "А я алкоголь не дуже… У вас є безалкогольні напої?"
es = "Yo el alcohol no… ¿Tienen bebidas sin alcohol?"
uses = ["ノンアルコールの飲[の]み物[もの]はありますか"]

[[dialog]]
speaker = "店[てん]員[いん]"
ja = "ウーロン茶[ちゃ]|と|ジュース|が|あります|。"
en = "We have oolong tea and juice."
ru = "Есть улун и сок."
uk = "Є улун і сік."
es = "Tenemos té oolong y zumo."

[[dialog]]
speaker = "カリナ"
ja = "じゃ|、|ウーロン茶[ちゃ]|を|お願[ねが]いします|。"
en = "Then oolong tea, please."
ru = "Тогда улун, пожалуйста."
uk = "Тоді улун, будь ласка."
es = "Entonces un té oolong, por favor."

[[dialog]]
speaker = "店[てん]員[いん]"
ja = "お通[とお]し|です|。|ご注[ちゅう]文[もん]=注[ちゅう]文[もん]|は|お決[き]まり|です|か|。"
en = "Here's your table appetizer. Are you ready to order?"
ru = "Это закуска от заведения. Готовы заказать?"
uk = "Це закуска від закладу. Готові замовити?"
es = "Aquí tienen el aperitivo de la casa. ¿Ya saben qué van a pedir?"
uses = ["お通[とお]しです", "ご注文[ちゅうもん]はお決[き]まりですか"]

[[dialog]]
speaker = "マリア"
ja = "おすすめ|は|何[なん]|です|か|。"
en = "What do you recommend?"
ru = "Что посоветуете?"
uk = "Що порадите?"
es = "¿Qué nos recomienda?"
uses = ["おすすめは何[なん]ですか"]

[[dialog]]
speaker = "店[てん]員[いん]"
ja = "焼[や]き鳥[とり]|です|。|焼[や]き鳥[とり]|は|塩[しお]|と|タレ|、|どちら|に|しますか=します|。"
en = "The yakitori. Would you like it with salt or with sauce?"
ru = "Якитори. С солью или с соусом?"
uk = "Якіторі. З сіллю чи з соусом?"
es = "El yakitori. ¿Lo quieren con sal o con salsa?"
uses = ["焼[や]き鳥[とり]は塩[しお]とタレ、どちらにしますか"]

[[dialog]]
speaker = "ワン"
ja = "両[りょう]方[ほう]|お願[ねが]いします|。|それから|、|とりあえず|枝[えだ]豆[まめ]|と|唐[から]揚[あ]げ|を|お願[ねが]いします|。"
en = "Both, please. And to start, edamame and fried chicken."
ru = "И то и другое, пожалуйста. И для начала эдамамэ и курицу во фритюре."
uk = "І те, й інше, будь ласка. І для початку едамаме та курку у фритюрі."
es = "Los dos, por favor. Y para empezar, edamame y pollo frito."
uses = ["とりあえず枝豆[えだまめ]と唐揚[からあ]げをお願[ねが]いします"]

[[dialog]]
speaker = "田[た]中[なか]"
ja = "じゃ|、|一[いっ]週[しゅう]間[かん]|お疲[つか]れ様[さま]|でした|。|乾[かん]杯[ぱい]|！"
en = "Well, thanks for all your hard work this week. Cheers!"
ru = "Ну, спасибо всем за неделю работы. За нас!"
uk = "Ну, дякую всім за тиждень роботи. Будьмо!"
es = "Bueno, buen trabajo esta semana. ¡Salud!"
uses = ["乾杯[かんぱい]！"]

[[dialog]]
speaker = "マリア"
