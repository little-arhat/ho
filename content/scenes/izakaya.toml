en = "Karina, what are you doing this weekend?"
ru = "Карина, что будешь делать на выходных?"
uk = "Карино, що робитимеш на вихідних?"
es = "Karina, ¿qué haces este fin de semana?"

[[dialog]]
speaker = "カリナ"
