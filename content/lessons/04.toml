number = 4
title = { en = "Time and the daily routine", ru = "Время и распорядок дня", uk = "Час і розпорядок дня" }
grammar = "～時[じ]・ます・ました・に・から・まで"

[[rule]]
title = { en = "Telling the time: ～時～分", ru = "Время: ～時～分", uk = "Час: ～時～分" }
pattern = [
  { ja = "今[いま]" },
  { slot = "time", en = "～じ ～ふん", ru = "～じ ～ふん", uk = "～じ ～ふん" },
  { ja = "です" },
]
explain.en = "Hours take 時 (じ), minutes take 分 (ふん / ぷん). Watch 4時 よじ, 7時 しちじ, 9時 くじ. 分 is ぷん after 1, 3, 4, 6, 8, 10 (いっぷん, さんぷん, よんぷん, ろっぷん, はっぷん, じゅっぷん). 半 (はん) = half past. 午前 = a.m., 午後 = p.m., and they come first: 午後 3時."
explain.ru = "Часы — 時 (じ), минуты — 分 (ふん / ぷん). Внимание: 4時 よじ, 7時 しちじ, 9時 くじ. 分 читается ぷん после 1, 3, 4, 6, 8, 10 (いっぷん, さんぷん, よんぷん, ろっぷん, はっぷん, じゅっぷん). 半 (はん) — половина. 午前 — до полудня, 午後 — после, и они стоят первыми: 午後 3時."
explain.uk = "Години — 時 (じ), хвилини — 分 (ふん / ぷん). Увага: 4時 よじ, 7時 しちじ, 9時 くじ. 分 читається ぷん після 1, 3, 4, 6, 8, 10 (いっぷん, さんぷん, よんぷん, ろっぷん, はっぷん, じゅっぷん). 半 (はん) — пів. 午前 — до полудня, 午後 — після, і вони стоять першими: 午後 3時."
example = [
  { ja = "今[いま]４時[じ]５分[ふん]です。", en = "It is 4:05 now.", ru = "Сейчас 4:05.", uk = "Зараз 4:05." },
  { ja = "今[いま]９時[じ]半[はん]です。", en = "It is half past nine.", ru = "Сейчас половина десятого.", uk = "Зараз пів на десяту." },
  { ja = "今[いま]何[なん]時[じ]ですか。", en = "What time is it now?", ru = "Который час?", uk = "Котра година?" },
]

[[rule]]
title = { en = "Polite verbs: ます, ません, ました, ませんでした", ru = "Вежливые глаголы: ます, ません, ました, ませんでした", uk = "Ввічливі дієслова: ます, ません, ました, ませんでした" }
explain.en = "A polite verb ends in ます. Change only the ending: ます = do / will do (present and future), ません = don't / won't, ました = did, ませんでした = didn't. There is no separate future tense."
explain.ru = "Вежливый глагол оканчивается на ます. Меняется только окончание: ます — делаю / сделаю (настоящее и будущее), ません — не делаю, ました — делал, ませんでした — не делал. Отдельного будущего времени нет."
explain.uk = "Ввічливе дієслово закінчується на ます. Змінюється лише закінчення: ます — роблю / зроблю (теперішній і майбутній), ません — не роблю, ました — робив, ませんでした — не робив. Окремого майбутнього часу немає."
table = { head = ["", "present ＋", "present −", "past ＋", "past −"], rows = [
  ["寝[ね]る", "ねます", "ねません", "ねました", "ねませんでした"],
  ["休[やす]む", "やすみます", "やすみません", "やすみました", "やすみませんでした"],
  ["働[はたら]く", "はたらきます", "はたらきません", "はたらきました", "はたらきませんでした"],
  ["勉[べん]強[きょう]する", "べんきょうします", "べんきょうしません", "べんきょうしました", "べんきょうしませんでした"],
] }
example = [
  { ja = "わたしは毎[まい]日[にち]勉[べん]強[きょう]します。", en = "I study every day.", ru = "Я занимаюсь каждый день.", uk = "Я вчуся щодня." },
  { ja = "きのう勉[べん]強[きょう]しませんでした。", en = "I didn't study yesterday.", ru = "Вчера я не занимался.", uk = "Учора я не вчився." },
]

[[rule]]
title = { en = "Time に: at what time", ru = "Время に: во сколько", uk = "Час に: о котрій" }
pattern = [
  { slot = "person", en = "who", ru = "кто", uk = "хто" },
  { ja = "は" },
  { slot = "time", en = "time", ru = "время", uk = "час" },
  { ja = "に" },
  { slot = "verb", en = "verb", ru = "глагол", uk = "дієслово" },
]
explain.en = "に marks a point in time when it has a number: ～時～分に, ～年～月～日に. With days of the week に is optional (金曜日に or 金曜日). Relative time words never take に: きのう, きょう, あした, けさ, 毎日, あさ, こんばん. ことし の ３がつに: the number part keeps に."
explain.ru = "に отмечает момент времени, если в нём есть число: ～時～分に, ～年～月～日に. С днями недели に необязателен (金曜日に или 金曜日). Относительные слова времени никогда не берут に: きのう, きょう, あした, けさ, 毎日, あさ, こんばん. ことし の ３がつに: часть с числом сохраняет に."
explain.uk = "に позначає момент часу, якщо в ньому є число: ～時～分に, ～年～月～日に. З днями тижня に необов'язковий (金曜日に або 金曜日). Відносні слова часу ніколи не беруть に: きのう, きょう, あした, けさ, 毎日, あさ, こんばん. ことし の ３がつに: частина з числом зберігає に."
example = [
  { ja = "わたしは毎[まい]朝[あさ]６時[じ]に起[お]きます。", en = "I get up at six every morning.", ru = "Каждое утро я встаю в шесть.", uk = "Щоранку я встаю о шостій." },
  { ja = "わたしは９時[じ]に日[に]本[ほん]語[ご]を勉[べん]強[きょう]します。", en = "I study Japanese at nine.", ru = "Я учу японский в девять.", uk = "Я вчу японську о дев'ятій." },
  { ja = "あさコーヒーを飲[の]みます。", en = "I drink coffee in the morning (no に).", ru = "Утром я пью кофе (без に).", uk = "Уранці я п'ю каву (без に)." },
]

[[rule]]
title = { en = "～から ～まで: from … until …", ru = "～から ～まで: с … до …", uk = "～から ～まで: з … до …" }
pattern = [
  { slot = "time", en = "start", ru = "начало", uk = "початок" },
  { ja = "から" },
  { slot = "time", en = "end", ru = "конец", uk = "кінець" },
  { ja = "まで" },
  { slot = "verb", en = "verb / です", ru = "глагол / です", uk = "дієслово / です" },
]
explain.en = "から = from (a starting point), まで = until / as far as. They work with times, days and places, together or alone, and can end directly in です."
explain.ru = "から — с, от (начальная точка), まで — до. Работают со временем, днями и местами, вместе или по одному, и могут прямо заканчиваться です."
explain.uk = "から — з, від (початкова точка), まで — до. Працюють із часом, днями й місцями, разом або окремо, і можуть одразу закінчуватися です."
example = [
  { ja = "昼[ひる]休[やす]みは１２時[じ]から１時[じ]までです。", en = "Lunch break is from twelve to one.", ru = "Обеденный перерыв с двенадцати до часу.", uk = "Обідня перерва з дванадцятої до першої." },
  { ja = "わたしは９時[じ]から５時[じ]まで働[はたら]きます。", en = "I work from nine to five.", ru = "Я работаю с девяти до пяти.", uk = "Я працюю з дев'ятої до п'ятої." },
  { ja = "月[げつ]曜[よう]日[び]から金[きん]曜[よう]日[び]まで働[はたら]きます。", en = "I work Monday to Friday.", ru = "Я работаю с понедельника по пятницу.", uk = "Я працюю з понеділка до п'ятниці." },
]

[[rule]]
title = { en = "N₁ と N₂: and (between nouns)", ru = "N₁ と N₂: и (между сущ.)", uk = "N₁ と N₂: і (між імен.)" }
explain.en = "と joins nouns only: どようびと にちようび = Saturday and Sunday. It does not join sentences or verbs."
explain.ru = "と соединяет только существительные: どようびと にちようび — суббота и воскресенье. Предложения и глаголы он не соединяет."
explain.uk = "と з'єднує лише іменники: どようびと にちようび — субота й неділя. Речення й дієслова він не з'єднує."
example = [
  { ja = "休[やす]みは土[ど]曜[よう]日[び]と日[にち]曜[よう]日[び]です。", en = "My days off are Saturday and Sunday.", ru = "Мои выходные — суббота и воскресенье.", uk = "Мої вихідні — субота й неділя." },
]

[[rule]]
title = { en = "～ね: isn't it?", ru = "～ね: не так ли?", uk = "～ね: чи не так?" }
explain.en = "ね at the end asks for agreement or shows sympathy: 大変ですね = that's tough, isn't it? Like a soft \"right?\"."
explain.ru = "ね в конце ищет согласия или выражает сочувствие: 大変ですね — тяжело вам, да? Как мягкое «правда?»."
explain.uk = "ね у кінці шукає згоди або висловлює співчуття: 大変ですね — важко вам, так? Як м'яке «правда ж?»."
example = [
  { ja = "毎[まい]晩[ばん]１２時[じ]まで勉[べん]強[きょう]します。— 大[たい]変[へん]ですね。", en = "I study until midnight every night. — That's tough.", ru = "Каждый вечер занимаюсь до двенадцати. — Тяжело вам.", uk = "Щовечора вчуся до дванадцятої. — Важко вам." },
]

[[exercise]]
kind = "choice"
ja = "わたしは毎[まい]朝[あさ]６時[じ]＿起[お]きます。"
options = ["に", "は", "で", "から"]
answer = "に"
en = "I get up at six every morning."
ru = "Каждое утро я встаю в шесть."
uk = "Щоранку я встаю о шостій."

[[exercise]]
kind = "choice"
ja = "銀[ぎん]行[こう]は９時[じ]から３時[じ]＿です。"
options = ["まで", "から", "に", "と"]
answer = "まで"
en = "The bank is open from nine until three."
ru = "Банк работает с девяти до трёх."
uk = "Банк працює з дев'ятої до третьої."

[[exercise]]
kind = "choice"
ja = "休[やす]みは土[ど]曜[よう]日[び]＿日[にち]曜[よう]日[び]です。"
options = ["と", "の", "も", "に"]
answer = "と"
en = "My days off are Saturday and Sunday."
ru = "Выходные — суббота и воскресенье."
uk = "Вихідні — субота й неділя."

[[exercise]]
kind = "choice"
ja = "きのう勉[べん]強[きょう]＿。"
options = ["しませんでした", "しません", "します"]
answer = "しませんでした"
en = "I didn't study yesterday."
ru = "Вчера я не занимался."
uk = "Учора я не вчився."

[[exercise]]
kind = "choice"
ja = "今[いま]９時[じ]＿です。"
options = ["半[はん]", "分[ふん]", "ごろ"]
answer = "半[はん]"
en = "It's half past nine."
ru = "Сейчас половина десятого."
uk = "Зараз пів на десяту."

[[exercise]]
kind = "choice"
ja = "あさ＿コーヒーを飲[の]みます。"
options = ["(nothing)", "に", "で"]
answer = "(nothing)"
en = "I drink coffee in the morning."
ru = "Утром я пью кофе."
uk = "Уранці я п'ю каву."

[[exercise]]
kind = "reorder"
parts = ["わたしは", "９時[じ]から", "５時[じ]まで", "働[はたら]きます。"]
en = "I work from nine to five."
ru = "Я работаю с девяти до пяти."
uk = "Я працюю з дев'ятої до п'ятої."

[[note]]
text = """
練習A
今 4じ5ふん / 9じはん (はん = 30 min) です。
休みは すいようび / どようびと にちようび です。
昼休みは 12じ から 1じ まで です。
わたしは 9じ / げつようび から 5じ / きんようび まで 働きます。
"""

[[note]]
text = """
present ＋　ます
present −　ません
past ＋　ました
past −　ませんでした
"""
