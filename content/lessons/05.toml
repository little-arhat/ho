title = { en = "Does this go to Koshien?", ru = "Этот поезд идёт в Косиэн?", uk = "Цей потяг іде до Косіена?" }

[[rule]]
title = { en = "Place へ 行きます・来ます・帰ります", ru = "Место へ 行きます・来ます・帰ります", uk = "Місце へ 行きます・来ます・帰ります" }
pattern = [
  { slot = "person", en = "who", ru = "кто", uk = "хто" },
  { ja = "は" },
  { slot = "place", en = "place", ru = "место", uk = "місце" },
  { ja = "へ" },
  { slot = "verb", en = "go / come / go home", ru = "идти / прийти / вернуться", uk = "іти / прийти / повернутися" },
]
explain.en = "へ (read e) marks the direction of movement with 行きます (go), 来ます (come) and 帰ります (go home, return). に also works with these verbs: スーパーに 行きます. Ask with どこへ."
explain.ru = "へ (читается «э») отмечает направление движения с 行きます (идти), 来ます (приходить) и 帰ります (возвращаться домой). С этими глаголами можно и に: スーパーに 行きます. Вопрос — どこへ («куда»)."
explain.uk = "へ (читається «е») позначає напрямок руху з 行きます (іти), 来ます (приходити) і 帰ります (повертатися додому). З цими дієсловами можна й に: スーパーに 行きます. Питання — どこへ («куди»)."
example = [
  { ja = "わたしはスーパーへ行[い]きます。", en = "I'm going to the supermarket.", ru = "Я иду в супермаркет.", uk = "Я йду до супермаркету." },
  { ja = "あなたはどこへ行[い]きますか。", en = "Where are you going?", ru = "Куда вы идёте?", uk = "Куди ви йдете?" },
  { ja = "６時[じ]にうちへ帰[かえ]ります。", en = "I go home at six.", ru = "Я возвращаюсь домой в шесть.", uk = "Я повертаюся додому о шостій." },
]

[[rule]]
title = { en = "The whole sentence: who, with whom, when, how, where, verb", ru = "Всё предложение: кто, с кем, когда, на чём, куда, глагол", uk = "Усе речення: хто, з ким, коли, чим, куди, дієслово" }
pattern = [
  { slot = "person", en = "person", ru = "человек", uk = "людина" },
  { ja = "と" },
  { slot = "time", en = "time", ru = "время", uk = "час" },
  { ja = "に" },
  { slot = "transport", en = "transport", ru = "транспорт", uk = "транспорт" },
  { ja = "で" },
  { slot = "place", en = "place", ru = "место", uk = "місце" },
  { ja = "へ" },
  { slot = "verb", en = "verb", ru = "глагол", uk = "дієслово" },
]
explain.en = "Each piece carries its own particle, so the order of the pieces is fairly free, but the verb always comes last. This order is the usual one."
explain.ru = "Каждая часть несёт свою частицу, поэтому порядок частей довольно свободный, но глагол всегда в конце. Этот порядок — самый обычный."
explain.uk = "Кожна частина має свою частку, тому порядок частин досить вільний, але дієслово завжди в кінці. Цей порядок — найзвичайніший."
example = [
  { ja = "家[か]族[ぞく]と日[にち]曜[よう]日[び]に電[でん]車[しゃ]で京[きょう]都[と]へ行[い]きます。", en = "On Sunday I'm going to Kyoto by train with my family.", ru = "В воскресенье я еду с семьёй в Киото на поезде.", uk = "У неділю я їду з родиною до Кіото потягом." },
]

[[rule]]
title = { en = "Transport で: by …", ru = "Транспорт で: на …", uk = "Транспорт で: чим …" }
pattern = [
  { slot = "transport", en = "transport", ru = "транспорт", uk = "транспорт" },
  { ja = "で" },
  { slot = "place", en = "place", ru = "место", uk = "місце" },
  { ja = "へ" },
  { slot = "verb", en = "verb", ru = "глагол", uk = "дієслово" },
]
explain.en = "で marks the means: バスで = by bus, 電車で = by train. On foot is different: 歩いて 行きます, with no で. Ask with 何で."
explain.ru = "で отмечает средство, как творительный падеж: バスで — на автобусе, 電車で — на электричке. Пешком — иначе: 歩いて 行きます, без で. Вопрос — 何で («на чём»)."
explain.uk = "で позначає засіб, як орудний відмінок: バスで — автобусом, 電車で — електричкою. Пішки — інакше: 歩いて 行きます, без で. Питання — 何で («чим»)."
example = [
  { ja = "バスで会[かい]社[しゃ]へ行[い]きます。", en = "I go to the office by bus.", ru = "Я езжу на работу на автобусе.", uk = "Я їжджу на роботу автобусом." },
  { ja = "何[なん]で会[かい]社[しゃ]へ行[い]きますか。", en = "How do you get to work?", ru = "На чём вы ездите на работу?", uk = "Чим ви їздите на роботу?" },
  { ja = "駅[えき]まで歩[ある]いて行[い]きます。", en = "I walk to the station.", ru = "До станции я иду пешком.", uk = "До станції я йду пішки." },
]

[[rule]]
title = { en = "Person と: with someone", ru = "Человек と: с кем-то", uk = "Людина と: з кимось" }
explain.en = "と after a person = together with them: 友達と 行きます. Alone is ひとりで. Ask with だれと."
explain.ru = "と после человека — «вместе с ним»: 友達と 行きます. Одному — ひとりで. Вопрос — だれと («с кем»)."
explain.uk = "と після людини — «разом із нею»: 友達と 行きます. Самому — ひとりで. Питання — だれと («з ким»)."
example = [
  { ja = "お兄[にい]さんといっしょに行[い]きます。", en = "I'm going with my (older) brother.", ru = "Я иду вместе со старшим братом.", uk = "Я йду разом зі старшим братом." },
  { ja = "ひとりで東[とう]京[きょう]へ来[き]ました。", en = "I came to Tokyo alone.", ru = "Я приехал в Токио один.", uk = "Я приїхав до Токіо сам." },
]

[[rule]]
title = { en = "いつ: when", ru = "いつ: когда", uk = "いつ: коли" }
explain.en = "いつ asks about time in general (day, month, year) and never takes に. For a clock time ask なんじに."
explain.ru = "いつ спрашивает о времени вообще (день, месяц, год) и никогда не берёт に. О времени на часах спрашивают なんじに."
explain.uk = "いつ питає про час загалом (день, місяць, рік) і ніколи не бере に. Про час на годиннику питають なんじに."
example = [
  { ja = "いつ日[に]本[ほん]へ来[き]ましたか。", en = "When did you come to Japan?", ru = "Когда вы приехали в Японию?", uk = "Коли ви приїхали до Японії?" },
  { ja = "誕[たん]生[じょう]日[び]はいつですか。", en = "When is your birthday?", ru = "Когда у вас день рождения?", uk = "Коли у вас день народження?" },
]

[[rule]]
title = { en = "Nowhere, no one, nothing: question word + も + negative", ru = "Никуда, никто, ничего: вопр. слово + も + отрицание", uk = "Нікуди, ніхто, нічого: пит. слово + も + заперечення" }
explain.en = "A question word with も and a negative verb means \"no …\": どこ(へ)も 行きません = I go nowhere, だれも 来ません = no one comes, 何も しません = I do nothing. The verb must be negative."
explain.ru = "Вопросительное слово с も и отрицательный глагол — «никто / ничто»: どこ(へ)も 行きません — никуда не иду, だれも 来ません — никто не приходит, 何も しません — ничего не делаю. Как в русском, двойное отрицание: глагол обязательно отрицательный."
explain.uk = "Питальне слово з も і заперечне дієслово — «ніхто / ніщо»: どこ(へ)も 行きません — нікуди не йду, だれも 来ません — ніхто не приходить, 何も しません — нічого не роблю. Як в українській, подвійне заперечення: дієслово обов'язково заперечне."
example = [
  { ja = "どこも行[い]きたくないです。", en = "I don't want to go anywhere.", ru = "Я никуда не хочу идти.", uk = "Я нікуди не хочу йти." },
  { ja = "だれも来[き]ませんでした。", en = "No one came.", ru = "Никто не пришёл.", uk = "Ніхто не прийшов." },
  { ja = "何[なに]ももってきませんでした。", en = "I didn't bring anything.", ru = "Я ничего не принёс.", uk = "Я нічого не приніс." },
]

[[rule]]
title = { en = "Counting things: ～本・～人・～枚", ru = "Счёт предметов: ～本・～人・～枚", uk = "Лічба предметів: ～本・～人・～枚" }
explain.en = "Japanese counts with a counter word chosen by the shape of the thing. 本 (ほん): long thin things like pens, bottles, bananas. 人 (にん): people, with ひとり and ふたり for one and two. 枚 (まい): thin flat things like paper, tickets, shirts. 本 changes its sound: いっぽん, さんぼん, ろっぽん, はっぽん, じゅっぽん."
explain.ru = "В японском считают со счётным словом, выбранным по форме предмета. 本 (ほん): длинное и тонкое — ручки, бутылки, бананы. 人 (にん): люди, причём «один, двое» — ひとり, ふたり. 枚 (まい): тонкое и плоское — бумага, билеты, рубашки. 本 меняет звук: いっぽん, さんぼん, ろっぽん, はっぽん, じゅっぽん."
explain.uk = "У японській рахують з лічильним словом, обраним за формою предмета. 本 (ほん): довге й тонке — ручки, пляшки, банани. 人 (にん): люди, причому «один, двоє» — ひとり, ふたり. 枚 (まい): тонке й пласке — папір, квитки, сорочки. 本 змінює звук: いっぽん, さんぼん, ろっぽん, はっぽん, じゅっぽん."
table = { head = ["", "-本[ほん]", "-人[にん]", "-枚[まい]"], rows = [
  ["1", "いっぽん", "ひとり", "いちまい"],
  ["2", "にほん", "ふたり", "にまい"],
  ["3", "さんぼん", "さんにん", "さんまい"],
  ["4", "よんほん", "よにん", "よんまい"],
  ["5", "ごほん", "ごにん", "ごまい"],
  ["6", "ろっぽん", "ろくにん", "ろくまい"],
  ["7", "ななほん", "ななにん、しちにん", "ななまい"],
  ["8", "はっぽん", "はちにん", "はちまい"],
  ["9", "きゅうほん", "きゅうにん", "きゅうまい"],
  ["10", "じゅっぽん、じっぽん", "じゅうにん", "じゅうまい"],
  ["?", "なんぼん", "なんにん", "なんまい"],
] }
example = [
  { ja = "ビールを２本[ほん]ください。", en = "Two bottles of beer, please.", ru = "Две бутылки пива, пожалуйста.", uk = "Дві пляшки пива, будь ласка." },
  { ja = "きっぷを３枚[まい]ください。", en = "Three tickets, please.", ru = "Три билета, пожалуйста.", uk = "Три квитки, будь ласка." },
]

