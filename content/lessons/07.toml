ja = "「Thank you」は日[に]本[ほん]語[ご]＿何[なん]ですか。"
options = ["で", "に", "の"]
answer = "で"
en = "What is \"thank you\" in Japanese?"
ru = "Как будет «спасибо» по-японски?"
uk = "Як буде «дякую» японською?"

