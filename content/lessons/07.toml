number = 7
title = { en = "Giving and receiving; by means of", ru = "Дарить и получать; с помощью чего", uk = "Дарувати й отримувати; за допомогою чого", es = "Dar y recibir; por medio de" }
grammar = "で（道[どう]具[ぐ]）・～語[ご]で・あげます／もらいます／くれます・貸[か]します／借[か]ります・教[おし]えます／習[なら]います・もう～ました・まだです"

[[rule]]
title = { en = "Tool / means で: with, by, in (a language)", ru = "Инструмент / средство で: чем, на каком языке", uk = "Інструмент / засіб で: чим, якою мовою", es = "Herramienta / medio で: con, por, en (un idioma)" }
pattern = [
  { slot = "thing", en = "tool / language", ru = "инструмент / язык", uk = "інструмент / мова", es = "herramienta / idioma" },
  { ja = "で" },
  { slot = "verb", en = "verb", ru = "глагол", uk = "дієслово", es = "verbo" },
]
explain.en = "で after a tool or method says what you do it with: はしで 食べます = I eat with chopsticks. Languages work the same way: 日本語で 書きます = I write in Japanese. (Lesson 5's で for transport is the same idea.)"
explain.ru = "で после инструмента или способа говорит, чем делают: はしで 食べます — ем палочками. С языками так же: 日本語で 書きます — пишу по-японски. (で транспорта из 5-го урока — та же идея.)"
explain.uk = "で після інструмента чи способу каже, чим роблять: はしで 食べます — їм паличками. З мовами так само: 日本語で 書きます — пишу японською. (で транспорту з 5-го уроку — та сама ідея.)"
explain.es = "で después de una herramienta o un método dice con qué lo haces: はしで 食べます = como con palillos. Con los idiomas funciona igual: 日本語で 書きます = escribo en japonés. (El で del transporte de la lección 5 es la misma idea.)"
example = [
  { ja = "はしで食[た]べます。", en = "I eat with chopsticks.", ru = "Ем палочками.", uk = "Їм паличками.", es = "Como con palillos." },
  { ja = "はさみで紙[かみ]を切[き]ります。", en = "I cut paper with scissors.", ru = "Режу бумагу ножницами.", uk = "Ріжу папір ножицями.", es = "Corto papel con tijeras." },
  { ja = "日[に]本[ほん]語[ご]でレポートを書[か]きます。", en = "I write the report in Japanese.", ru = "Пишу доклад по-японски.", uk = "Пишу доповідь японською.", es = "Escribo el informe en japonés." },
]

[[rule]]
title = { en = "Word は ～語で 何ですか: what is it in …?", ru = "Слово は ～語で 何ですか: как это на …?", uk = "Слово は ～語で 何ですか: як це …?", es = "Palabra は ～語で 何ですか: ¿cómo se dice en …?" }
explain.en = "Ask for a word in another language with ～語で 何ですか. The answer repeats the pattern: 「Thank you」は 日本語で 何ですか。—「ありがとう」です。"
explain.ru = "Как сказать слово на другом языке: ～語で 何ですか. Ответ: 「Thank you」は 日本語で 何ですか。—「ありがとう」です。"
explain.uk = "Як сказати слово іншою мовою: ～語で 何ですか. Відповідь: 「Thank you」は 日本語で 何ですか。—「ありがとう」です。"
explain.es = "Para preguntar una palabra en otro idioma: ～語で 何ですか. La respuesta repite el patrón: 「Thank you」は 日本語で 何ですか。—「ありがとう」です。"
example = [
  { ja = "「Thank you」は日[に]本[ほん]語[ご]で何[なん]ですか。", en = "What is \"thank you\" in Japanese?", ru = "Как будет «спасибо» по-японски?", uk = "Як буде «дякую» японською?", es = "¿Cómo se dice «gracias» en japonés?" },
  { ja = "「ありがとう」です。", en = "It's ありがとう.", ru = "«Аригато».", uk = "«Арігато».", es = "Se dice ありがとう." },
]

[[rule]]
title = { en = "Person に あげます / もらいます: give, receive", ru = "Человек に あげます / もらいます: дарить, получать", uk = "Людина に あげます / もらいます: дарувати, отримувати", es = "Persona に あげます / もらいます: dar, recibir" }
pattern = [
  { slot = "person", en = "person", ru = "человек", uk = "людина", es = "persona" },
  { ja = "に" },
  { slot = "thing", en = "thing", ru = "вещь", uk = "річ", es = "cosa" },
  { ja = "を" },
  { slot = "verb", en = "あげます / もらいます…", ru = "あげます / もらいます…", uk = "あげます / もらいます…", es = "あげます / もらいます…" },
]
explain.en = "に marks the other person. With あげます (give), に is who gets it; with もらいます (receive), に is who it comes from (から also works). The subject は is the one who gives, or the one who receives."
explain.ru = "に отмечает другого человека. С あげます (дарить) に — кому; с もらいます (получать) に — от кого (можно и から). Подлежащее с は — тот, кто дарит, или тот, кто получает."
explain.uk = "に позначає іншу людину. З あげます (дарувати) に — кому; з もらいます (отримувати) に — від кого (можна й から). Підмет з は — той, хто дарує, або той, хто отримує."
explain.es = "に marca a la otra persona. Con あげます (dar), に es quien lo recibe; con もらいます (recibir), に es de quien viene (también vale から). El sujeto con は es quien da, o quien recibe."
example = [
  { ja = "わたしは木[き]村[むら]さんに花[はな]をあげました。", en = "I gave Ms. Kimura flowers.", ru = "Я подарил Кимуре-сан цветы.", uk = "Я подарував Кімурі-сан квіти.", es = "Le di flores a la señora Kimura." },
  { ja = "わたしはカリナさんにチョコレートをもらいました。", en = "I got chocolate from Karina.", ru = "Я получил шоколад от Карины.", uk = "Я отримав шоколад від Карини.", es = "Karina me dio chocolate." },
]

[[rule]]
title = { en = "Giver は わたしに くれます: someone gives me", ru = "Даритель は わたしに くれます: кто-то дарит мне", uk = "Дарувальник は わたしに くれます: хтось дарує мені", es = "Quien da は わたしに くれます: alguien me da" }
pattern = [
  { slot = "giver", en = "giver", ru = "кто дарит", uk = "хто дарує", es = "quien da" },
  { ja = "は" },
  { ja = "わたしに" },
  { slot = "thing", en = "thing", ru = "вещь", uk = "річ", es = "cosa" },
  { ja = "を" },
  { ja = "くれます" },
]
explain.en = "くれます is \"give\" when the one who receives is me, or someone on my side (my mother 母, father 父, older sister 姉). あげます never goes towards me: not 母は わたしに あげました. The same event told from my side is もらいます: 母は わたしに セーターを くれました = わたしは 母に セーターを もらいました. わたしに is often left out. When the giver is above you, the polite form is くださいます."
explain.ru = "くれます — «дарить», когда получаю я или кто-то из «своих» (мама 母, папа 父, старшая сестра 姉). あげます никогда не направлено ко мне: не 母は わたしに あげました. То же событие с моей стороны — もらいます: 母は わたしに セーターを くれました = わたしは 母に セーターを もらいました. わたしに часто опускают. Если даёт тот, кто выше по статусу, вежливая форма — くださいます."
explain.uk = "くれます — «дарувати», коли отримую я або хтось зі «своїх» (мама 母, тато 父, старша сестра 姉). あげます ніколи не спрямоване до мене: не 母は わたしに あげました. Та сама подія з мого боку — もらいます: 母は わたしに セーターを くれました = わたしは 母に セーターを もらいました. わたしに часто опускають. Якщо дає хтось вищий за статусом, ввічлива форма — くださいます."
explain.es = "くれます es «dar» cuando quien recibe soy yo o alguien de los míos (mi madre 母, mi padre 父, mi hermana mayor 姉). あげます nunca va hacia mí: no 母は わたしに あげました. El mismo hecho contado desde mí es もらいます: 母は わたしに セーターを くれました = わたしは 母に セーターを もらいました. わたしに se omite a menudo. Si quien da está por encima de ti, la forma cortés es くださいます."
example = [
  { ja = "母[はは]はわたしにセーターをくれました。", en = "My mother gave me a sweater.", ru = "Мама подарила мне свитер.", uk = "Мама подарувала мені светр.", es = "Mi madre me regaló un suéter." },
  { ja = "わたしは母[はは]にセーターをもらいました。", en = "I got a sweater from my mother.", ru = "Я получил свитер от мамы.", uk = "Я отримав светр від мами.", es = "Recibí un suéter de mi madre." },
  { ja = "佐[さ]藤[とう]さんはわたしに花[はな]をくれました。", en = "Mr. Sato gave me flowers.", ru = "Сато-сан подарил мне цветы.", uk = "Сато-сан подарував мені квіти.", es = "El señor Sato me regaló flores." },
]

[[rule]]
title = { en = "Lend / borrow, teach / learn: the same two directions", ru = "Одалживать / брать взаймы, учить / учиться: те же два направления", uk = "Позичати комусь / позичати в когось, навчати / вчитися: ті самі два напрямки", es = "Prestar / pedir prestado, enseñar / aprender: las mismas dos direcciones" }
pattern = [
  { slot = "person", en = "person", ru = "человек", uk = "людина", es = "persona" },
  { ja = "に" },
  { slot = "thing", en = "thing / subject", ru = "вещь / предмет", uk = "річ / предмет", es = "cosa / materia" },
  { ja = "を" },
  { slot = "verb", en = "かします / かります…", ru = "かします / かります…", uk = "かします / かります…", es = "かします / かります…" },
]
table = { head = ["Ⓐ → Ⓑ", "Ⓐ ← Ⓑ"], rows = [
  ["あげます", "もらいます"],
  ["貸[か]します", "借[か]ります"],
  ["教[おし]えます", "習[なら]います"],
] }
explain.en = "Three verb pairs work like あげます / もらいます, in Ⓐは Ⓑに ～を V. The left column goes out from Ⓐ: に is who gets it — 貸します (lend), 教えます (teach). The right column comes in to Ⓐ: に is who it comes from (から also works) — 借ります (borrow), 習います (learn). 教えます also means \"tell\" a piece of information: 電話番号を 教えます. 電話を かけます (phone) takes に for the person you call."
explain.ru = "Три пары глаголов работают как あげます / もらいます, в схеме Ⓐは Ⓑに ～を V. Левый столбец — от Ⓐ наружу: に — кому: 貸します (одалживать), 教えます (учить). Правый — к Ⓐ: に — от кого (можно и から): 借ります (брать взаймы), 習います (учиться). 教えます значит ещё «сообщить»: 電話番号を 教えます — дать номер телефона. 電話を かけます (звонить) берёт に — кому звонят."
explain.uk = "Три пари дієслів працюють як あげます / もらいます, у схемі Ⓐは Ⓑに ～を V. Лівий стовпчик — від Ⓐ назовні: に — кому: 貸します (позичати комусь), 教えます (навчати). Правий — до Ⓐ: に — від кого (можна й から): 借ります (позичати в когось), 習います (вчитися). 教えます означає ще «повідомити»: 電話番号を 教えます — дати номер телефону. 電話を かけます (дзвонити) бере に — кому дзвонять."
explain.es = "Tres pares de verbos funcionan como あげます / もらいます, en Ⓐは Ⓑに ～を V. La columna izquierda sale de Ⓐ: に es quien lo recibe — 貸します (prestar), 教えます (enseñar). La derecha llega a Ⓐ: に es de quien viene (también vale から) — 借ります (pedir prestado), 習います (aprender). 教えます también significa «decir» un dato: 電話番号を 教えます = dar el número de teléfono. 電話を かけます (llamar) lleva に para la persona a quien llamas."
example = [
  { ja = "わたしはワンさんに傘[かさ]を貸[か]しました。", en = "I lent Wang an umbrella.", ru = "Я одолжил Вану зонт.", uk = "Я позичив Ванові парасольку.", es = "Le presté un paraguas a Wang." },
  { ja = "ワンさんはわたしに傘[かさ]を借[か]りました。", en = "Wang borrowed an umbrella from me.", ru = "Ван взял у меня зонт.", uk = "Ван позичив у мене парасольку.", es = "Wang me pidió prestado un paraguas." },
  { ja = "わたしは山[やま]田[だ]さんに日[に]本[ほん]語[ご]を習[なら]います。", en = "I learn Japanese from Mr. Yamada.", ru = "Я учу японский у Ямады-сан.", uk = "Я вчу японську в Ямади-сан.", es = "Aprendo japonés con el señor Yamada." },
  { ja = "山[やま]田[だ]さんはわたしに日[に]本[ほん]語[ご]を教[おし]えます。", en = "Mr. Yamada teaches me Japanese.", ru = "Ямада-сан учит меня японскому.", uk = "Ямада-сан навчає мене японської.", es = "El señor Yamada me enseña japonés." },
  { ja = "カリナさんに電[でん]話[わ]番[ばん]号[ごう]を教[おし]えました。", en = "I told Karina my phone number.", ru = "Я дал Карине свой номер телефона.", uk = "Я дав Карині свій номер телефону.", es = "Le di a Karina mi número de teléfono." },
  { ja = "母[はは]に電[でん]話[わ]をかけます。", en = "I'll call my mother.", ru = "Я позвоню маме.", uk = "Я подзвоню мамі.", es = "Voy a llamar a mi madre." },
]

[[rule]]
title = { en = "もう V ました / まだです: already / not yet", ru = "もう V ました / まだです: уже / ещё нет", uk = "もう V ました / まだです: уже / ще ні", es = "もう V ました / まだです: ya / todavía no" }
explain.en = "もう ～ましたか asks if something is already done. Yes: はい、もう ～ました. No: いいえ、まだです (not yet) — not ～ませんでした, which would mean you didn't do it at all."
explain.ru = "もう ～ましたか — уже сделали? Да: はい、もう ～ました. Нет: いいえ、まだです (ещё нет) — а не ～ませんでした, что значило бы «не сделал вовсе»."
explain.uk = "もう ～ましたか — уже зробили? Так: はい、もう ～ました. Ні: いいえ、まだです (ще ні) — а не ～ませんでした, що означало б «не зробив узагалі»."
explain.es = "もう ～ましたか pregunta si algo ya está hecho. Sí: はい、もう ～ました. No: いいえ、まだです (todavía no) — no ～ませんでした, que significaría que no lo hiciste en absoluto."
example = [
  { ja = "もう荷[に]物[もつ]を送[おく]りましたか。", en = "Have you sent the package yet?", ru = "Вы уже отправили посылку?", uk = "Ви вже надіслали посилку?", es = "¿Ya has enviado el paquete?" },
  { ja = "はい、もう送[おく]りました。", en = "Yes, I already sent it.", ru = "Да, уже отправил.", uk = "Так, уже надіслав.", es = "Sí, ya lo he enviado." },
  { ja = "いいえ、まだです。", en = "No, not yet.", ru = "Нет, ещё нет.", uk = "Ні, ще ні.", es = "No, todavía no." },
]

[[rule]]
title = { en = "Visiting someone's home", ru = "В гостях", uk = "У гостях", es = "De visita en una casa" }
explain.en = "At the door: ごめんください (hello, anyone home?). The host: いらっしゃい, どうぞ お上がり ください (come in). Coming in: 失礼します. Offered something: ～は いかがですか (how about…?); before eating: いただきます."
explain.ru = "У двери: ごめんください (есть кто дома?). Хозяин: いらっしゃい, どうぞ お上がり ください (проходите). Входя: 失礼します. Угощая: ～は いかがですか (не хотите ли…?); перед едой: いただきます."
explain.uk = "Біля дверей: ごめんください (є хтось удома?). Господар: いらっしゃい, どうぞ お上がり ください (проходьте). Заходячи: 失礼します. Пригощаючи: ～は いかがですか (чи не бажаєте…?); перед їжею: いただきます."
explain.es = "En la puerta: ごめんください (¿hola, hay alguien?). El anfitrión: いらっしゃい, どうぞ お上がり ください (pase). Al entrar: 失礼します. Si te ofrecen algo: ～は いかがですか (¿qué tal…?); antes de comer: いただきます."
example = [
  { ja = "コーヒーはいかがですか。", en = "Would you like some coffee?", ru = "Не хотите кофе?", uk = "Чи не бажаєте кави?", es = "¿Quiere un café?" },
  { ja = "ありがとうございます。いただきます。", en = "Thank you. (before eating or drinking)", ru = "Спасибо. (перед едой)", uk = "Дякую. (перед їжею)", es = "Gracias. (antes de comer o beber)" },
]

