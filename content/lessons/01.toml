number = 1
title_ja = "初[はじ]めまして"
title = { en = "Nice to meet you", ru = "Приятно познакомиться", uk = "Приємно познайомитися" }

[[rule]]
title = { en = "A is B: N₁ は N₂ です", ru = "A — это B: N₁ は N₂ です", uk = "A — це B: N₁ は N₂ です" }
pattern = [
  { slot = "thing", en = "topic", ru = "тема", uk = "тема" },
  { ja = "は" },
  { slot = "thing", en = "noun", ru = "сущ.", uk = "імен." },
  { ja = "です" },
]
explain.en = "は (read wa) marks the topic: what you are talking about. です closes a polite statement: \"is / am / are\". Japanese has no articles and no plural, and です does not change for person."
explain.ru = "は (читается «ва») отмечает тему — то, о чём идёт речь. です завершает вежливое утверждение: «есть, является». Артиклей и множественного числа нет, です не меняется по лицам — как «это …» в русском."
explain.uk = "は (читається «ва») позначає тему — те, про що йдеться. です завершує ввічливе твердження: «є, є ним». Артиклів і множини немає, です не змінюється за особами — як «це …» в українській."
example = [
  { ja = "私[わたし]はマイク・ミラーです。", en = "I am Mike Miller.", ru = "Я Майк Миллер.", uk = "Я Майк Міллер." },
  { ja = "私[わたし]は会[かい]社[しゃ]員[いん]です。", en = "I am a company employee.", ru = "Я служащий компании.", uk = "Я працівник компанії." },
]

[[rule]]
title = { en = "Is not: N₁ は N₂ じゃ ありません", ru = "Не является: N₁ は N₂ じゃ ありません", uk = "Не є: N₁ は N₂ じゃ ありません" }
pattern = [
  { slot = "thing", en = "topic", ru = "тема", uk = "тема" },
  { ja = "は" },
  { slot = "thing", en = "noun", ru = "сущ.", uk = "імен." },
  { ja = "じゃ ありません" },
]
explain.en = "The negative of です. じゃ ありません is spoken; では ありません is the same, more formal and written."
explain.ru = "Отрицание です. じゃ ありません — разговорный вариант; では ありません — то же самое, официальнее и в письменной речи."
explain.uk = "Заперечення です. じゃ ありません — розмовний варіант; では ありません — те саме, офіційніше й у письмовому мовленні."
example = [
  { ja = "サントスさんは学[がく]生[せい]じゃ ありません。", en = "Mr. Santos is not a student.", ru = "Сантос-сан не студент.", uk = "Сантос-сан не студент." },
]

[[rule]]
title = { en = "Questions: … か", ru = "Вопрос: … か", uk = "Питання: … か" }
pattern = [
  { slot = "thing", en = "statement", ru = "утверждение", uk = "твердження" },
  { ja = "か" },
]
explain.en = "Add か at the end of a sentence to make it a question. Word order does not change, and there is no question mark in careful writing. Answer with はい、そうです (yes) or いいえ、… じゃ ありません (no). A question word (だれ, なんさい) goes where the answer would stand."
explain.ru = "Добавьте か в конце предложения — и это вопрос. Порядок слов не меняется. Ответ: はい、そうです (да) или いいえ、… じゃ ありません (нет). Вопросительное слово (だれ, なんさい) ставится туда, где будет ответ."
explain.uk = "Додайте か у кінці речення — і це питання. Порядок слів не змінюється. Відповідь: はい、そうです (так) або いいえ、… じゃ ありません (ні). Питальне слово (だれ, なんさい) стоїть там, де буде відповідь."
example = [
  { ja = "ミラーさんは会[かい]社[しゃ]員[いん]ですか。", en = "Is Mr. Miller a company employee?", ru = "Миллер-сан служащий компании?", uk = "Міллер-сан працівник компанії?" },
  { ja = "はい、そうです。", en = "Yes, he is.", ru = "Да, это так.", uk = "Так, це так." },
  { ja = "あの方[かた]はどなたですか。", en = "Who is that person?", ru = "Кто тот человек? (вежливо)", uk = "Хто та людина? (ввічливо)" },
]

[[rule]]
title = { en = "Also: N も", ru = "Тоже: N も", uk = "Також: N も" }
pattern = [
  { slot = "thing", en = "noun", ru = "сущ.", uk = "імен." },
  { ja = "も" },
  { slot = "thing", en = "…です", ru = "…です", uk = "…です" },
]
explain.en = "も means \"also, too\". It replaces は: ミラーさんも会社員です, not ミラーさんはも."
explain.ru = "も значит «тоже, также». Он заменяет は: ミラーさんも会社員です, а не ミラーさんはも."
explain.uk = "も означає «теж, також». Він замінює は: ミラーさんも会社員です, а не ミラーさんはも."
example = [
  { ja = "ミラーさんは会[かい]社[しゃ]員[いん]です。グプタさんも会[かい]社[しゃ]員[いん]です。", en = "Mr. Miller is a company employee. Mr. Gupta is also a company employee.", ru = "Миллер-сан служащий компании. Гупта-сан тоже служащий компании.", uk = "Міллер-сан працівник компанії. Гупта-сан теж працівник компанії." },
]

[[rule]]
title = { en = "N₁ の N₂: of, belonging to, about", ru = "N₁ の N₂: чей, о чём", uk = "N₁ の N₂: чий, про що" }
pattern = [
  { slot = "thing", en = "N₁ (owner, group, topic)", ru = "N₁ (владелец, группа, тема)", uk = "N₁ (власник, група, тема)" },
  { ja = "の" },
  { slot = "thing", en = "N₂ (the thing)", ru = "N₂ (сам предмет)", uk = "N₂ (сам предмет)" },
]
explain.en = "の joins two nouns; the first describes the second. The order is the reverse of English \"of\": はは の ほん = mother's book, じどうしゃ の ほん = a book about cars, IMC の しゃいん = an IMC employee."
explain.ru = "の соединяет два существительных; первое описывает второе, как родительный падеж: はは の ほん = книга мамы, じどうしゃ の ほん = книга об автомобилях, IMC の しゃいん = сотрудник IMC."
explain.uk = "の з'єднує два іменники; перший описує другий, як родовий відмінок: はは の ほん = книга мами, じどうしゃ の ほん = книга про автомобілі, IMC の しゃいん = працівник IMC."
example = [
  { ja = "ミラーさんはIMCの社[しゃ]員[いん]です。", en = "Mr. Miller is an IMC employee.", ru = "Миллер-сан — сотрудник IMC.", uk = "Міллер-сан — працівник IMC." },
  { ja = "母[はは]の本[ほん]", en = "my mother's book", ru = "книга мамы", uk = "книга мами" },
  { ja = "じどうしゃの本[ほん]", en = "a book about cars", ru = "книга об автомобилях", uk = "книга про автомобілі" },
]

[[rule]]
title = { en = "～さん: names and titles", ru = "～さん: имена и обращения", uk = "～さん: імена та звертання" }
explain.en = "Add さん after another person's family or given name: 田中さん. Never after your own name. Children get ～ちゃん, boys often ～くん. Some titles replace さん: 先生 (teacher, doctor)."
explain.ru = "さん ставится после фамилии или имени другого человека: 田中さん. Никогда — после своего имени. Детям — ～ちゃん, мальчикам часто ～くん. Некоторые звания заменяют さん: 先生 (учитель, врач)."
explain.uk = "さん ставиться після прізвища чи імені іншої людини: 田中さん. Ніколи — після свого імені. Дітям — ～ちゃん, хлопчикам часто ～くん. Деякі звання замінюють さん: 先生 (учитель, лікар)."

[[rule]]
title = { en = "Age: ～さい, なんさい / おいくつ", ru = "Возраст: ～さい, なんさい / おいくつ", uk = "Вік: ～さい, なんさい / おいくつ" }
pattern = [
  { slot = "person", en = "person", ru = "человек", uk = "людина" },
  { ja = "は" },
  { slot = "question", en = "なんさい / おいくつ", ru = "なんさい / おいくつ", uk = "なんさい / おいくつ" },
  { ja = "ですか" },
]
explain.en = "Count years with the counter 歳 (さい). Ask ～は なんさいですか (plain) or ～は おいくつですか (polite, with respect). Watch the sound changes at 1, 8 and 10; 20 years old has its own word, はたち."
explain.ru = "Годы считают счётным словом 歳 (さい). Спрашивают ～は なんさいですか (просто) или ～は おいくつですか (вежливо, с уважением). Следите за изменением звука на 1, 8 и 10; 20 лет — отдельное слово はたち."
explain.uk = "Роки рахують лічильним словом 歳 (さい). Питають ～は なんさいですか (просто) або ～は おいくつですか (ввічливо, з повагою). Стежте за зміною звуку на 1, 8 і 10; 20 років — окреме слово はたち."
table = { head = ["", "-歳[さい]"], rows = [
  ["1", "いっさい"], ["2", "にさい"], ["3", "さんさい"], ["4", "よんさい"], ["5", "ごさい"],
  ["6", "ろくさい"], ["7", "ななさい"], ["8", "はっさい"], ["9", "きゅうさい"], ["10", "じゅっさい、じっさい"],
  ["20", "はたち"], ["?", "なんさい、おいくつ"],
] }
example = [
  { ja = "テレサちゃんは何[なん]歳[さい]ですか。", en = "How old is Teresa?", ru = "Сколько лет Терезе?", uk = "Скільки років Терезі?" },
  { ja = "九[きゅう]歳[さい]です。", en = "She is nine.", ru = "Девять лет.", uk = "Дев'ять років." },
]

[[rule]]
title = { en = "Numbers", ru = "Числа", uk = "Числа" }
explain.en = "Japanese counts in units of ten thousand (万), not thousands: 10,000 = いちまん, 100,000 = じゅうまん, 1,000,000 = ひゃくまん. 4 is usually よん and 9 usually きゅう (し and く sound like death and suffering). 7 is なな or しち. Sound changes: 300 さんびゃく, 600 ろっぴゃく, 800 はっぴゃく, 3,000 さんぜん, 8,000 はっせん. Zero is ゼロ or れい; in phone numbers often まる."
explain.ru = "Японцы считают десятками тысяч (万), а не тысячами: 10 000 = いちまん, 100 000 = じゅうまん, 1 000 000 = ひゃくまん. 4 обычно よん, 9 обычно きゅう (し и く звучат как «смерть» и «страдание»). 7 — なな или しち. Изменения звука: 300 さんびゃく, 600 ろっぴゃく, 800 はっぴゃく, 3000 さんぜん, 8000 はっせん. Ноль — ゼロ или れい; в номерах телефонов часто まる."
explain.uk = "Японці рахують десятками тисяч (万), а не тисячами: 10 000 = いちまん, 100 000 = じゅうまん, 1 000 000 = ひゃくまん. 4 зазвичай よん, 9 зазвичай きゅう (し і く звучать як «смерть» і «страждання»). 7 — なな або しち. Зміни звуку: 300 さんびゃく, 600 ろっぴゃく, 800 はっぴゃく, 3000 さんぜん, 8000 はっせん. Нуль — ゼロ або れい; у номерах телефонів часто まる."
table = { head = ["", "", "", ""], rows = [
  ["1 いち", "11 じゅういち", "100 ひゃく", "1,000 せん"],
  ["2 に", "12 じゅうに", "200 にひゃく", "2,000 にせん"],
  ["3 さん", "13 じゅうさん", "300 さんびゃく", "3,000 さんぜん"],
  ["4 よん", "14 じゅうよん", "400 よんひゃく", "4,000 よんせん"],
  ["5 ご", "15 じゅうご", "500 ごひゃく", "5,000 ごせん"],
