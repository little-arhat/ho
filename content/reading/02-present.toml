lesson = 2
title = { en = "Whose is it?", ru = "Чьё это?", uk = "Чиє це?", es = "¿De quién es?" }
scene = "Two colleagues at an office desk; one holds out a small wrapped box of chocolates, a wristwatch and a folded umbrella lie on the desk."

[[prose]]
ja = "机[つくえ]|の|時[と]計[けい]|は|誰[だれ]|の|です|か|。|マリア|さん|の|時[と]計[けい]|です|。"
en = "Whose is the watch on the desk? It's Maria's watch."
ru = "Чьи это часы на столе? Это часы Марии."
uk = "Чий це годинник на столі? Це годинник Марії."
es = "¿De quién es el reloj de la mesa? Es el reloj de Maria."

[[prose]]
ja = "あの|傘[かさ]|も|マリア|さん|の|です|か|。|いいえ|、|違[ちが]います。|田[た]中[なか]|さん|の|傘[かさ]|です|。"
uses = ["いいえ、違[ちが]います"]
en = "Is that umbrella Maria's too? No, it isn't. It's Mr. Tanaka's umbrella."
ru = "Тот зонт тоже Марии? Нет. Это зонт Танаки-сана."
uk = "Та парасолька теж Марії? Ні. Це парасолька Танаки-сана."
es = "¿Ese paraguas también es de Maria? No. Es el paraguas del señor Tanaka."

[[prose]]
ja = "これ|は|何[なん]|です|か|。|チョコレート|です|。|マリア|さん|の|チョコレート|じゃ ありません|。|田[た]中[なか]|さん|の|です|。"
uses = ["これは何[なん]ですか"]
en = "What is this? It's chocolate. It isn't Maria's chocolate. It's Mr. Tanaka's."
ru = "Что это? Шоколад. Это не шоколад Марии. Он Танаки-сана."
uk = "Що це? Шоколад. Це не шоколад Марії. Він Танаки-сана."
es = "¿Qué es esto? Es chocolate. No es el chocolate de Maria. Es del señor Tanaka."

[[prose]]
ja = "「|田[た]中[なか]|さん|、|これ|、|ほんの気[き]持[も]ちです。|どうぞ|。|」|「|どうもありがとうございます。|」"
en = "“Mr. Tanaka, here, just a small token. Please.” “Thank you very much.”"
ru = "«Танака-сан, вот, небольшой знак внимания. Пожалуйста». «Большое спасибо»."
uk = "«Танако-сан, ось, невеликий знак уваги. Будь ласка». «Щиро дякую»."
es = "«Señor Tanaka, tome, es solo un detalle». «Muchas gracias»."

[[dialog]]
