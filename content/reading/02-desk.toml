lesson = 2
title = { en = "On my desk", ru = "На моём столе", uk = "На моєму столі", es = "En mi escritorio" }
scene = "A tidy wooden desk seen from above: a laptop, a thick dictionary, a paperback book, a notebook and a few pencils, warm morning light."

[[prose]]
ja = "これ|は|私[わたし]|の|机[つくえ]|です|。|この|椅[い]子[す]|も|私[わたし]|の|です|。"
en = "This is my desk. This chair is mine too."
ru = "Это мой стол. Этот стул тоже мой."
uk = "Це мій стіл. Цей стілець теж мій."
es = "Este es mi escritorio. Esta silla también es mía."

[[prose]]
ja = "この|本[ほん]|は|日[に]本[ほん]語[ご]|の|本[ほん]|です|。|その|辞[じ]書[しょ]|は|英[えい]語[ご]|の|辞[じ]書[しょ]|です|。"
en = "This book is a Japanese book. That dictionary is an English dictionary."
ru = "Эта книга — на японском. Тот словарь — английский."
uk = "Ця книга — японською. Той словник — англійський."
es = "Este libro es un libro de japonés. Ese diccionario es un diccionario de inglés."

[[prose]]
ja = "あれ|は|パソコン|です|か|、|テレビ|です|か|。|パソコン|です|。|私[わたし]|の|パソコン|じゃ ありません|。|兄[あに]|の|です|。"
en = "Is that over there a computer or a TV? It's a computer. It isn't my computer. It's my older brother's."
ru = "Вон то — компьютер или телевизор? Компьютер. Это не мой компьютер. Он моего старшего брата."
uk = "Он те — комп'ютер чи телевізор? Комп'ютер. Це не мій комп'ютер. Він мого старшого брата."
es = "¿Aquello es un ordenador o una tele? Es un ordenador. No es mi ordenador. Es de mi hermano mayor."

[[prose]]
ja = "この|鉛[えん]筆[ぴつ]|は|誰[だれ]|の|です|か|。|ワン|さん|の|です|。|その|ノート|も|ワン|さん|の|です|。"
en = "Whose pencil is this? It's Mr. Wang's. That notebook is Mr. Wang's too."
ru = "Чей это карандаш? Ван-сана. Та тетрадь тоже Ван-сана."
uk = "Чий це олівець? Ван-сана. Той зошит теж Ван-сана."
es = "¿De quién es este lápiz? Es del señor Wang. Ese cuaderno también es del señor Wang."

[[prose]]
ja = "これ|は|何[なん]|です|か|。|目[め]覚[ざ]まし時[ど]計[けい]|です|。|私[わたし]|の|目[め]覚[ざ]まし時[ど]計[けい]|です|。"
uses = ["これは何[なん]ですか"]
en = "What is this? It's an alarm clock. It's my alarm clock."
ru = "Что это? Будильник. Это мой будильник."
uk = "Що це? Будильник. Це мій будильник."
es = "¿Qué es esto? Es un despertador. Es mi despertador."

[[dialog]]
