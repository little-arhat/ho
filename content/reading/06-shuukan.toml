ja = "お|酒[さけ]|は|？"
en = "What about alcohol?"
ru = "А алкоголь?"
uk = "А алкоголь?"
es = "¿Y alcohol?"

[[dialog]]
speaker = "カリナ"
ja = "めったに|飲[の]みません=飲[の]みます|。|いつも|お茶[ちゃ]|か|ジュース|を|飲[の]みます|。"
en = "I hardly ever drink. I always have tea or juice."
ru = "Почти не пью. Обычно пью чай или сок."
uk = "Майже не п'ю. Зазвичай п'ю чай або сік."
es = "Casi nunca bebo. Siempre tomo té o zumo."

[[dialog]]
speaker = "山[やま]田[だ]"
ja = "土[ど]曜[よう]日[び]|は|何[なに]|を|します|か|。"
en = "What do you do on Saturdays?"
ru = "А что вы делаете по субботам?"
uk = "А що ви робите по суботах?"
es = "¿Qué haces los sábados?"

[[dialog]]
speaker = "カリナ"
ja = "いつも|図[と]書[しょ]館[かん]|で|本[ほん]|を|読[よ]みます|。|時[とき]々[どき]|手[て]紙[がみ]|も|書[か]きます|。"
en = "I always read books at the library. Sometimes I write letters too."
ru = "Всегда читаю книги в библиотеке. Иногда ещё пишу письма."
uk = "Завжди читаю книжки в бібліотеці. Іноді ще пишу листи."
es = "Siempre leo libros en la biblioteca. A veces también escribo cartas."

[[dialog]]
speaker = "山[やま]田[だ]"
ja = "誰[だれ]|に|手[て]紙[がみ]|を|書[か]きます|か|。"
en = "Who do you write letters to?"
ru = "А кому вы пишете письма?"
uk = "А кому ви пишете листи?"
es = "¿A quién escribes cartas?"

[[dialog]]
speaker = "カリナ"
ja = "家[か]族[ぞく]|に|書[か]きます|。|日[に]本[ほん]語[ご]|の|手[て]紙[がみ]|です|。"
en = "To my family. Letters in Japanese."
ru = "Семье. Письма на японском."
uk = "Родині. Листи японською."
es = "A mi familia. Cartas en japonés."

[[dialog]]
speaker = "山[やま]田[だ]"
ja = "そうですか。|テレビ|は|よく|見[み]ます|か|。"
en = "I see. Do you watch TV often?"
ru = "Вот как. А телевизор часто смотрите?"
uk = "Он як. А телевізор часто дивитеся?"
es = "Ya veo. ¿Ves mucho la tele?"

[[dialog]]
