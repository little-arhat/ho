en = "Not that much. But sometimes I watch videos in Japanese."
ru = "Не так уж часто. Но иногда смотрю видео на японском."
uk = "Не так уже й часто. Але іноді дивлюся відео японською."
es = "No tanto. Pero a veces veo vídeos en japonés."

[[dialog]]
