lesson = 4
title = { en = "My day", ru = "Мой день", uk = "Мій день" }
scene = "A cosy morning scene: an alarm clock on a bedside table, a person stretching by a window with the sun rising over a quiet Japanese town."

[[paragraph]]
ja = "私[わたし]|は|毎[まい]朝[あさ]|七[しち]時[じ]|に|起[お]きます|。"
en = "I get up at seven every morning."
ru = "Каждое утро я встаю в семь."
uk = "Щоранку я встаю о сьомій."

[[paragraph]]
ja = "九[く]時[じ]から|五[ご]時[じ]まで|働[はたら]きます|。|昼[ひる]休[やす]み|は|一[いち]時[じ]|まで|です|。"
en = "I work from nine to five. Lunch break lasts until one."
ru = "Я работаю с девяти до пяти. Обеденный перерыв — до часу."
uk = "Я працюю з дев'ятої до п'ятої. Обідня перерва — до першої."

[[paragraph]]
ja = "毎[まい]晩[ばん]|勉[べん]強[きょう]します|。|昨日[きのう]|は|勉[べん]強[きょう]しませんでした=勉[べん]強[きょう]します|。|大[たい]変[へん]ですね。"
en = "I study every evening. Yesterday I didn't study. Tough, isn't it?"
ru = "Каждый вечер я занимаюсь. Вчера не занимался. Тяжело, да?"
uk = "Щовечора я вчуся. Учора не вчився. Важко, так?"

[[paragraph]]
ja = "今日[きょう]|は|土[ど]曜[よう]日[び]|です|。|休[やす]み|です|。|十[じゅう]時[じ]=時[じ]|に|起[お]きました=起[お]きます|。"
en = "Today is Saturday. It's my day off. I got up at ten."
ru = "Сегодня суббота. Выходной. Я встал в десять."
uk = "Сьогодні субота. Вихідний. Я встав о десятій."

[[new]]
ja = "時[じ]"
en = "… o'clock"
ru = "… часов"
uk = "… година"
