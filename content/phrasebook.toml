uk = "Це мій друг (подруга) 〇〇"
casual = "友達[ともだち]の〇〇だよ"
note = "Family: 妻[つま] wife, 夫[おっと] husband, 息子[むすこ] son, 娘[むすめ] daughter."

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "hear"
ja = "お名前[なまえ]は何[なん]とおっしゃいますか"
en = "May I ask your name?"
ru = "Как вас зовут? (вежливо)"
uk = "Як вас звати? (ввічливо)"
casual = "名前[なまえ]なんていうの？"
answers = [
    { ja = "〇〇と申[もう]します", en = "My name is 〇〇", ru = "Меня зовут 〇〇", uk = "Мене звати 〇〇" },
]

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "hear"
ja = "どうぞよろしくお願[ねが]いします"
en = "Pleased to meet you"
ru = "Рад(а) знакомству"
uk = "Радий(а) знайомству"
casual = "よろしく！"
answers = [
    { ja = "こちらこそ、よろしくお願[ねが]いします", en = "Likewise", ru = "Взаимно", uk = "Навзаєм" },
]

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "名刺[めいし]をどうぞ"
en = "Here is my business card"
ru = "Вот моя визитка"
uk = "Ось моя візитівка"
note = "Give and receive with both hands, text facing the other person."

[[phrase.answers]]
ja = "頂戴[ちょうだい]します"
en = "(Receiving) Thank you, I'll gladly take it"
ru = "Спасибо, с благодарностью принимаю"
uk = "Дякую, з вдячністю приймаю"

[[phrase]]
topic = "greet"
section = "Polite set phrases"
kind = "say"
ja = "失礼[しつれい]します"
