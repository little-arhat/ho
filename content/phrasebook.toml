en = "We are very sorry"
ru = "Приносим извинения"
uk = "Перепрошуємо"
casual = "ごめんね"

[[phrase]]
topic = "basics"
section = "Common staff phrases"
kind = "say"
ja = "お手洗[てあら]いはどこですか"
en = "Where is the toilet?"
ru = "Где туалет?"
uk = "Де туалет?"
casual = "トイレどこ？"
note = "トイレはどこですか is also fine. Signs: 男[おとこ] men, 女[おんな] women."

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "say"
ja = "おはようございます"
en = "Good morning"
ru = "Доброе утро"
uk = "Доброго ранку"
casual = "おはよう"
note = "Until about 10–11 am. At work it's used at the start of any shift, even at night."

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "say"
ja = "こんにちは"
en = "Hello / Good afternoon"
ru = "Здравствуйте / Добрый день"
uk = "Добрий день"
note = "Daytime. Rarely said to colleagues or family; it's for neighbours, shop staff, acquaintances."

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "say"
ja = "こんばんは"
en = "Good evening"
ru = "Добрый вечер"
uk = "Добрий вечір"

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "say"
ja = "どうも"
en = "Hi / Thanks (all-purpose)"
ru = "Привет / Спасибо (универсально)"
uk = "Привіт / Дякую (універсально)"
level = "neutral"
note = "Short and safe with acquaintances. Works as a light thank-you too."

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "say"
ja = "お疲[つか]れ様[さま]です"
en = "Hello (to colleagues) / Thanks for your work"
ru = "Здравствуйте (коллегам) / Спасибо за работу"
uk = "Привіт (колегам) / Дякую за роботу"
casual = "お疲[つか]れ！"
level = "work"
note = "The default greeting between people who work together, any time of day."

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "say"
ja = "お久[ひさ]しぶりです"
en = "Long time no see"
ru = "Давно не виделись"
uk = "Давно не бачились"
casual = "久[ひさ]しぶり！"

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "say"
ja = "ご無沙汰[ぶさた]しております"
en = "It's been far too long (very formal)"
ru = "Давно не виделись (очень вежливо)"
uk = "Давно не бачились (дуже ввічливо)"
level = "formal"

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "say"
ja = "お元気[げんき]ですか"
en = "How are you?"
ru = "Как дела?"
uk = "Як справи?"
casual = "元気[げんき]？"
note = "Used after a long gap, not as a daily 'how are you'."

[[phrase]]
topic = "greet"
section = "Hello · by time and formality"
kind = "hear"
ja = "お元気[げんき]ですか"
en = "How are you?"
ru = "Как дела?"
uk = "Як справи?"
casual = "元気[げんき]？"
note = "おかげさまで ('thanks to you') is the polite, warm answer."

[[phrase.answers]]
ja = "はい、元気[げんき]です。〇〇さんは？"
en = "I'm well. And you?"
ru = "Хорошо. А у вас?"
uk = "Добре. А у вас?"

[[phrase.answers]]
ja = "おかげさまで"
en = "I'm well, thank you"
ru = "Хорошо, спасибо"
uk = "Добре, дякую"

[[phrase.answers]]
ja = "まあまあです"
en = "So-so"
ru = "Так себе"
uk = "Так собі"

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "はじめまして"
en = "Nice to meet you (first meeting)"
ru = "Приятно познакомиться"
uk = "Приємно познайомитися"
casual = "はじめまして"
note = "Always the first word when meeting someone new, at any level of formality."

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "〇〇と申[もう]します。どうぞよろしくお願[ねが]いいたします"
en = "My name is 〇〇. I'm very pleased to meet you"
ru = "Меня зовут 〇〇. Очень рад(а) знакомству"
uk = "Мене звати 〇〇. Дуже радий(а) знайомству"
casual = "〇〇です。よろしく！"
level = "formal"
note = "The full formal self-introduction: business, a host family, a teacher. Bow while saying the second half."

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "どうぞよろしくお願[ねが]いします"
en = "Pleased to meet you / I look forward to working with you"
ru = "Рад(а) знакомству / Надеюсь на сотрудничество"
uk = "Радий(а) знайомству / Сподіваюся на співпрацю"
casual = "よろしく！"
level = "polite"
note = "どうぞ makes it warmer and more formal. Ladder: よろしく → よろしくお願[ねが]いします → どうぞよろしくお願[ねが]いします → どうぞよろしくお願[ねが]いいたします."

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "よろしくお願[ねが]いします"
en = "Nice to meet you / Please treat me well"
ru = "Рад(а) знакомству"
uk = "Радий(а) знайомству"
casual = "よろしくね"
level = "standard"
note = "Also said when asking a favour or starting anything together: a class, a tour, a meal."

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "こちらこそ、よろしくお願[ねが]いします"
en = "Likewise, pleased to meet you"
ru = "Взаимно, рад(а) знакомству"
uk = "Навзаєм, радий(а) знайомству"
casual = "こちらこそ！"
note = "The reply when someone says よろしく to you first."

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "〇〇と呼[よ]んでください"
en = "Please call me 〇〇"
ru = "Зовите меня 〇〇"
uk = "Називайте мене 〇〇"
casual = "〇〇って呼[よ]んで"
note = "Never add さん to your own name."

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "お会[あ]いできて嬉[うれ]しいです"
en = "I'm glad to meet you"
ru = "Рад(а) вас видеть"
uk = "Радий(а) вас бачити"
casual = "会[あ]えて嬉[うれ]しい！"

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "自己紹介[じこしょうかい]させていただきます"
en = "Allow me to introduce myself"
ru = "Позвольте представиться"
uk = "Дозвольте представитися"
casual = "自己紹介[じこしょうかい]するね"
level = "formal"

[[phrase]]
topic = "greet"
section = "Introductions · by formality"
kind = "say"
ja = "こちらは友人[ゆうじん]の〇〇です"
