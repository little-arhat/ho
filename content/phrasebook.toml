kind = "say"
ja = "お先[さき]にどうぞ"
en = "After you"
ru = "Проходите первым(-ой)"
uk = "Проходьте першим(-ою)"
casual = "お先[さき]にどうぞ"

[[phrase]]
topic = "greet"
section = "Polite set phrases"
kind = "say"
ja = "お世話[せわ]になっております"
en = "(Business) Thank you for your continued support"
ru = "(Деловое) Благодарю за сотрудничество"
uk = "(Ділове) Дякую за співпрацю"
level = "business"
note = "The standard opener in work emails and calls."

[[phrase]]
topic = "greet"
section = "Polite set phrases"
kind = "say"
ja = "色々[いろいろ]お世話[せわ]になりました"
en = "Thank you for everything"
ru = "Спасибо за всё"
uk = "Дякую за все"
casual = "色々[いろいろ]ありがとう"
note = "When leaving a hotel, a host, a job, or after a trip."

[[phrase]]
topic = "greet"
section = "Polite set phrases"
kind = "say"
ja = "〇〇さんによろしくお伝[つた]えください"
en = "Please give my regards to 〇〇"
ru = "Передайте привет 〇〇"
uk = "Передайте вітання 〇〇"
casual = "〇〇さんによろしく"

[[phrase]]
topic = "greet"
section = "Polite set phrases"
kind = "say"
ja = "お待[ま]たせしてすみません"
en = "Sorry to keep you waiting"
ru = "Извините, что заставил(а) ждать"
uk = "Вибачте, що змусив(ла) чекати"
casual = "待[ま]たせてごめん"

[[phrase]]
topic = "greet"
section = "Polite set phrases"
kind = "tip"
note = "Names: add さん to other people's names (田中[たなか]さん), never to your own. Family names come first in Japan. Bows go with よろしくお願[ねが]いします and 失礼[しつれい]します; a slight nod is enough for a foreign visitor."

