[[phrase]]
topic = "basics"
section = "Everyday must-haves"
kind = "say"
ja = "すみません"
en = "Excuse me / sorry"
ru = "Извините"
uk = "Перепрошую"
casual = "ごめん / あの…"
note = "The most useful word in Japan: gets attention, apologises, and thanks someone for trouble taken."

[[phrase]]
topic = "basics"
section = "Everyday must-haves"
kind = "say"
ja = "ありがとうございます"
en = "Thank you"
ru = "Спасибо"
uk = "Дякую"
casual = "ありがとう"

[[phrase]]
topic = "basics"
section = "Everyday must-haves"
kind = "say"
ja = "お願[ねが]いします"
en = "Please (when asking for something)"
ru = "Пожалуйста (прошу)"
uk = "Будь ласка (прошу)"
casual = "お願[ねが]い"
note = "Add after a noun: お水[みず]、お願[ねが]いします = Water, please."

[[phrase]]
topic = "basics"
section = "Everyday must-haves"
kind = "say"
ja = "大丈夫[だいじょうぶ]です"
