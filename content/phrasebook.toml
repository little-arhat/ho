kind = "say"
ja = "お手数[てすう]をおかけしますが、お願[ねが]いします"
en = "Sorry for the trouble, but please…"
ru = "Простите за хлопоты, но, пожалуйста…"
uk = "Вибачте за клопіт, але, будь ласка…"
casual = "面倒[めんどう]かけてごめん"
level = "formal"

[[phrase]]
topic = "greet"
section = "Polite set phrases"
kind = "say"
ja = "少々[しょうしょう]よろしいですか"
en = "Do you have a moment?"
ru = "Можно вас на минутку?"
uk = "Можна вас на хвилинку?"
casual = "ちょっといい？"

[[phrase]]
topic = "greet"
section = "Polite set phrases"
kind = "say"
ja = "お忙[いそが]しいところすみません"
en = "Sorry to bother you when you're busy"
ru = "Простите, что отвлекаю"
uk = "Вибачте, що відволікаю"
casual = "忙[いそが]しいのにごめん"

[[phrase]]
