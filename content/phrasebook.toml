ru = "Всё в порядке / Не нужно"
uk = "Усе гаразд / Не треба"
casual = "大丈夫[だいじょうぶ]"
note = "Also the standard soft way to decline a bag, a spoon, etc."

[[phrase]]
topic = "basics"
section = "Everyday must-haves"
kind = "say"
ja = "結構[けっこう]です"
en = "No, thank you (firm)"
ru = "Нет, спасибо (твёрдо)"
uk = "Ні, дякую (твердо)"
casual = "いらない"
note = "Firmer than 大丈夫[だいじょうぶ]です. Good for street touts."

[[phrase]]
topic = "basics"
